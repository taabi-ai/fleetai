name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (dev/staging/prod)'
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

jobs:
  deploy:
    name: Helm deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl cluster-info

      - name: Helm dependency update
        run: |
          helm dependency update deploy/helm/fleetai

      - name: Deploy
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          helm upgrade --install fleetai deploy/helm/fleetai \
            -f deploy/helm/fleetai/values-${{ github.event.inputs.environment }}.yaml \
            --namespace fleetai --create-namespace \
            --timeout 10m

      - name: Rollout wait
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          for svc in web gateway identity dashboard fleet-metrics ai platform-config notification media training engineering; do
            kubectl -n fleetai rollout status deployment/fleetai-$svc --timeout=300s || true
          done

      - name: Smoke
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.DOMAIN }}/api/health")
          [ "$code" = "200" ] || { echo "smoke failed ($code)"; exit 1; }
          echo "smoke ok ($code)"
