# HPA when autoscaling.type == hpa
{{- if and .Values.enabled (eq .Values.autoscaling.type "hpa") }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "fleetai.fullname" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "fleetai.fullname" . }}
  minReplicas: {{ .Values.replicas.min | default 1 }}
  maxReplicas: {{ .Values.replicas.max | default 5 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.cpuUtilization | default 70 }}
{{- end }}
