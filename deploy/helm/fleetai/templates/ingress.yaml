# deploy/helm/fleetai/templates/ingress.yaml — routes / to web, /api to gateway, /ingest to ingest-api.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  tls:
    - secretName: fleetai-tls
      hosts: [{{ .Values.global.domain | quote }}]
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          - path: /ingest
            pathType: Prefix
            backend:
            service: { name: {{ printf "%s-%s" .Release.Name "ingest-api" | quote }}, port: { number: 4013 } }
          - path: /api
            pathType: Prefix
            backend:
            service: { name: {{ printf "%s-%s" .Release.Name "gateway" | quote }}, port: { number: 4000 } }
          - path: /
            pathType: Prefix
            backend:
            service: { name: {{ printf "%s-%s" .Release.Name "web" | quote }}, port: { number: 3000 } }
