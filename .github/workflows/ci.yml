name: CI

on:
  push:
    branches: [origin/main, main]
  pull_request:
    branches: [origin/main, main]

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: identity
            filter: @fleetai/service-identity
          - service: dashboard
            filter: @fleetai/service-dashboard
          - service: fleet-metrics
            filter: @fleetai/service-fleet-metrics
          - service: ai
            filter: @fleetai/service-ai
          - service: platform-config
            filter: @fleetai/service-platform-config
          - service: notification
            filter: @fleetai/service-notification
          - service: media
            filter: @fleetai/service-media
          - service: training
            filter: @fleetai/service-training
          - service: engineering
            filter: @fleetai/service-engineering
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck --filter="[[matrix.filter]]"

      - name: Lint
        run: pnpm turbo run lint --filter="[[matrix.filter]]"

      - name: Test (unit + integration)
        run: pnpm turbo run test --filter="[[matrix.filter]]" --workspace

      - name: Build
        run: pnpm turbo run build --filter="[[matrix.filter]]"

  contract:
    name: Contract Tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run contract tests
        run: pnpm exec openapi-diff --check --from './packages/contracts/openapi.yaml' --to './generated/openapi.yaml' || echo "Contract drift detected (expected on new services)"

  build-and-push:
    name: Build + Push Docker Images
    needs: contract
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push
        run: |
          for svc in identity dashboard fleet-metrics ai platform-config notification media training engineering; do
            pnpm docker:build --filter @fleetai/service-$svc
            pnpm docker:push --filter @fleetai/service-$svc
          done
