# apps/gateway/routes.yaml — every legacy /api/* route with a strangler-fig flag.
# Flag: legacy | shadow | service
#   legacy  -> proxy to LEGACY_URL (the running monolith)
#   shadow  -> proxy to legacy AND asynchronously replay to the service, diff, log
#   service -> proxy to the owning service (adds x-fleetai-internal + x-fleetai-principal)
# Generated from docs/migration/06-REFERENCE/01-route-to-service-map.md (keep in sync).

routes:
  # --- identity ---
  - path: "/api/auth/[...nextauth]"
    methods: [GET, POST]
    service: identity
    servicePath: /auth/nextauth
    flag: legacy
    public: true
  - path: /api/auth/login
    methods: [POST]
    service: identity
    servicePath: /auth/login
    flag: legacy
    public: true
  - path: /api/signup
    methods: [POST]
    service: identity
    servicePath: /users/signup
    flag: legacy
    public: true
  - path: /api/admin/users
    methods: [GET, POST]
    service: identity
    servicePath: /users
    flag: legacy
    permission: admin.users
  - path: "/api/admin/users/[id]"
    methods: [PATCH, DELETE]
    service: identity
    servicePath: /users/:id
    flag: legacy
    permission: admin.users
  - path: /api/admin/roles
    methods: [GET, POST]
    service: identity
    servicePath: /roles
    flag: legacy
    permission: admin.roles
  - path: "/api/admin/roles/[name]"
    methods: [PATCH, DELETE]
    service: identity
    servicePath: /roles/:name
    flag: legacy
    permission: admin.roles
  - path: /api/user/ai-pin
    methods: [GET, POST, DELETE]
    service: identity
    servicePath: /me/ai-pin
    flag: legacy
  - path: /api/user/ai-pin/verify
    methods: [POST, DELETE]
    service: identity
    servicePath: /me/ai-pin/verify
    flag: legacy

